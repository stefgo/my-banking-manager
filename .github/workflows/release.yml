name: Create Release

# A release is an action, not a side effect of pushing. Pushes to main and dev publish the rolling
# :main and :dev images (build.yml) and nothing else; a version number is created only from here,
# only on request -- a release on main, a beta (x.y.z-beta.n) on dev.
#
# What a release is, how its version is found and how its notes are put together is the same for
# every stefgo project and lives in https://github.com/stefgo/release-workflows. This file offers
# the inputs and says what is particular here: the checks, the FinTS product ID, the version files
# and the images to build.
on:
    workflow_dispatch:
        inputs:
            dry_run:
                description: "Dry run -- shows the next version and its notes, changes nothing"
                type: boolean
                default: true
            bump:
                description: "Version step"
                type: choice
                options:
                    - auto
                    - patch
                    - minor
                    - major
                default: auto

# Two runs at once would read the same last tag and compute the same next version. Not
# cancelling: a release that dies after the tag leaves the tag without a matching image build.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    # In front of the checks: the branch, the hand-written notes in .release/next.md and the state
    # of dev against main are known at dispatch, and failing after a full check cycle would spend
    # minutes to report them.
    preflight:
        uses: stefgo/release-workflows/.github/workflows/preflight.yml@v1
        permissions:
            contents: read

    # The official mbm-server-full image of a release needs the product registration number. Checked before
    # the tag is created: missing afterwards, it would leave a release without images. Never
    # prints the value.
    product-id:
        name: FinTS product ID present
        needs: preflight
        runs-on: ubuntu-latest
        permissions: {}
        steps:
            - name: Check the repository secret
              env:
                  FINTS_PRODUCT_ID: ${{ secrets.FINTS_PRODUCT_ID }}
              run: |
                  if [ -z "$FINTS_PRODUCT_ID" ]; then
                    echo "::error::Repository secret FINTS_PRODUCT_ID is missing: official images need the FinTS product registration number."
                    exit 1
                  fi

    checks:
        needs: preflight
        uses: ./.github/workflows/ci.yml
        permissions:
            contents: read

    # No build step: the checks job already built the project, and nothing is published to a
    # package registry. The images come from build.yml, which the called workflow starts on the
    # new tag and waits for.
    release:
        needs: [checks, product-id]
        uses: stefgo/release-workflows/.github/workflows/release.yml@v1
        permissions:
            contents: write # tag, release, CHANGELOG/package.json commit
            issues: write # @semantic-release/github comments on issues ...
            pull-requests: write # ... and on pull requests
            actions: write # starts build.yml for the tag just created
        with:
            dry_run: ${{ inputs.dry_run }}
            bump: ${{ inputs.bump }}
            # A BREAKING CHANGE footer raises the minor position; the major one is reserved for
            # bump: major.
            breaking: minor
            # The workspaces carry the version too: the FinTS connector reports its own as the
            # product version to the bank, both connectors report theirs in /v1/info. Their entries in package-lock.json follow with the
            # next local npm install (npm ci accepts the difference).
            version_files: shared/package.json server/package.json connectors/fints/package.json connectors/enablebanking/package.json clients/web/package.json
            build_workflow: build.yml
