      tags:
        - Categories
      security:
        - session: []
        - device: []
      parameters:
        - name: ruleId
          in: query
          required: false
          schema:
            description: Only bookings this rule wins in a full run
            type: integer
            exclusiveMinimum: 0
            maximum: 9007199254740991
        - name: mode
          in: query
          required: false
          schema:
            default: empty
            type: string
            enum:
              - empty
              - all
            description: "empty: only fields without a value. all: every field with a rule result"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                          description: "Stable across fetches: account and fingerprint for a pending booking of the bank, else the booking id"
                        transactionId:
                          type: integer
                          exclusiveMinimum: 0
                          maximum: 9007199254740991
                        accountId:
                          type: integer
                          exclusiveMinimum: 0
                          maximum: 9007199254740991
                        bookingDate:
                          type: string
                        amount:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        counterparty:
                          type: string
                          description: Bank's value
                        remittance:
                          type: string
                          description: Bank's value
                        manual:
                          type: boolean
                          description: A booking made by hand; never chosen at first
                        split:
                          type: boolean
                          description: A split booking; rules never replace its categories
                        ruleId:
                          anyOf:
                            - type: integer
                              exclusiveMinimum: 0
                              maximum: 9007199254740991
                            - type: "null"
                          description: The rule that wins; null when a reset has no rule
                        changes:
                          minItems: 1
                          type: array
                          items:
                            type: object
                            properties:
                              field:
                                type: string
                                enum:
                                  - counterparty
                                  - remittance
                                  - category
                              kind:
                                type: string
                                enum:
                                  - fill
                                  - change
                                  - replace
                                  - reset
                                description: "fill: no value yet. change: from an earlier rule. replace: set by hand or otherwise. reset: back to the bank's value"
                              before:
                                description: Text shown now; for a category its id as text
                                type:
                                  - string
                                  - "null"
                              after:
                                description: Text shown afterwards; for a category its id as text
                                type:
                                  - string
                                  - "null"
                              selected:
                                type: boolean
                                description: Chosen at first
                            required:
                              - field
                              - kind
                              - before
                              - after
                              - selected
                            additionalProperties: false
                      required:
                        - key
                        - transactionId
                        - accountId
                        - bookingDate
                        - amount
                        - counterparty
                        - remittance
                        - manual
                        - split
                        - ruleId
                        - changes
                      additionalProperties: false
                    description: Every change, newest first
                  unchanged:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                    description: Bookings in scope that stay as they are
                  planHash:
                    type: string
                    description: Sent back with applyRules; a different result is refused
                required:
