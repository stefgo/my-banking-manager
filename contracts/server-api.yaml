  /api/transfers/payees:
    get:
      operationId: listPayees
      summary: Saved payees (last used first) and counterparties of debits that could become payees
      tags:
        - Transfers
      security:
        - session: []
        - device: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  payees:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          exclusiveMinimum: 0
                          maximum: 9007199254740991
                        name:
                          type: string
                        iban:
                          type: string
                        bic:
                          type:
                            - string
                            - "null"
                        lastUsedAt:
                          anyOf:
                            - type: string
                              description: ISO 8601 date and time
                            - type: "null"
                      required:
                        - id
                        - name
                        - iban
                        - bic
                        - lastUsedAt
                      additionalProperties: false
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        iban:
                          type: string
                        bic:
                          type:
                            - string
                            - "null"
                        lastDate:
                          type: string
                      required:
                        - name
                        - iban
                        - bic
                        - lastDate
                      additionalProperties: false
                required:
                  - payees
                  - suggestions
                additionalProperties: false
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
