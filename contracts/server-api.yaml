                          type: string
                        valueDate:
                          type:
                            - string
                            - "null"
                        amount:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        currency:
                          type: string
                          const: EUR
                        counterpartyName:
                          type: string
                        ultimateParty:
                          type: string
                        counterpartyIban:
                          type:
                            - string
                            - "null"
                        remittance:
                          type: string
                        bookingText:
                          type: string
                        reference:
                          type: string
                        customerReference:
                          type: string
                          description: Customer reference (KREF) the payer gave the order; "" if none
                        bankReference:
                          type: string
                          description: The bank's own reference of the booking; "" if none
                        mandateId:
                          type: string
                        creditorId:
                          type: string
                        counterpartyBic:
                          type: string
                          description: BIC of the counterparty; "" if none
                        counterpartyAccount:
                          type: string
                          description: Account of the counterparty when the bank names no IBAN; "" if none
                        counterpartyBankCode:
                          type: string
                          description: National bank code that goes with counterpartyAccount; "" if none
                        status:
                          type: string
                          enum:
                            - booked
                            - pending
                        source:
                          type: string
                          enum:
                            - bank
                            - manual
                            - import
                        importId:
                          anyOf:
                            - type: integer
                              exclusiveMinimum: 0
                              maximum: 9007199254740991
                            - type: "null"
                        counterTransactionId:
                          anyOf:
                            - type: integer
                              exclusiveMinimum: 0
                              maximum: 9007199254740991
                            - type: "null"
                        isReturn:
                          type: boolean
                          description: Gives back an earlier booking (return debit, cancellation)
                        returnReason:
                          type: string
                          description: Reason code of the return as the bank sends it; "" if none
                        returnOfId:
                          anyOf:
