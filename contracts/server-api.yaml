paths:
  /api/status:
    get:
      operationId: status
      summary: State of the server
      tags:
        - System
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                    enum:
                      - setup
                      - locked
                      - ready
                  version:
                    type: string
                  webBuild:
                    type:
                      - string
                      - "null"
                  webTheme:
                    type: string
                    enum:
                      - system
                      - dark
                      - light
                required:
                  - state
                  - version
                  - webBuild
                  - webTheme
                additionalProperties: false
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/setup:
    post:
      operationId: setup
      summary: Set up encryption with the first user; their password opens the database
      tags:
        - System
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                password:
                  type: string
                  minLength: 12
                  maxLength: 1024
                defaultCategories:
                  default: true
                  description: Create the start tree of categories
                  type: boolean
                defaultAccountGroups:
                  default: true
                  description: Create the start tree of account groups
                  type: boolean
              required:
                - name
                - password
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryKey:
                    type: string
                    description: Shown once; opens the database when a password is lost
                  totp:
                    type: object
                    properties:
                      setupToken:
                        type: string
                      secret:
                        type: string
                      uri:
                        type: string
                    required:
                      - setupToken
                      - secret
                      - uri
                    additionalProperties: false
                    description: The first user's second factor, confirmed with `confirmTotp`
                required:
                  - recoveryKey
                  - totp
                additionalProperties: false
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/recover:
    post:
      operationId: recover
      summary: Open the database with the recovery key and set a new password for a user; with `resetTotp` also start a new second factor
      tags:
        - System
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recoveryKey:
                  type: string
                  minLength: 1
                  maxLength: 200
                name:
                  type: string
                  minLength: 1
                password:
                  type: string
                  minLength: 12
                  maxLength: 1024
                resetTotp:
                  default: false
                  description: "The phone is lost as well: answer with a new TOTP secret to confirm"
                  type: boolean
              required:
                - recoveryKey
                - name
                - password
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  totp:
                    description: With `resetTotp`; confirmed with `confirmTotp`. Until then the old secret stays valid
                    type: object
                    properties:
                      setupToken:
                        type: string
                      secret:
                        type: string
                      uri:
                        type: string
                    required:
                      - setupToken
                      - secret
                      - uri
                    additionalProperties: false
                required:
                  - ok
                additionalProperties: false
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/recover/totp:
    post:
      operationId: recoverTotp
      summary: "Phone lost: start a new second factor with password and recovery key, confirmed with `confirmTotp`. The bank logins stay"
      tags:
        - System
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recoveryKey:
                  type: string
                  minLength: 1
                  maxLength: 200
                name:
                  type: string
                  minLength: 1
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
              required:
                - recoveryKey
                - name
                - password
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  setupToken:
                    type: string
                  secret:
                    type: string
                  uri:
                    type: string
                required:
                  - setupToken
                  - secret
                  - uri
                additionalProperties: false
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/lock:
    post:
      operationId: lock
      summary: Lock the database until a user enters their password
      tags:
        - System
      security:
        - session: []
        - device: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                required:
                  - ok
                additionalProperties: false
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/system/recovery-key:
    post:
      operationId: newRecoveryKey
      summary: Replace the recovery key of the installation; confirmed with the signed-in user's password and TOTP code
      tags:
        - System
      security:
        - session: []
        - device: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  minLength: 1
                code:
                  type: string
                  pattern: ^\d{6}$
                  description: Code of the signed-in user
              required:
                - password
                - code
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryKey:
                    type: string
                    description: Shown once
                required:
                  - recoveryKey
                additionalProperties: false
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/activity:
    get:
      operationId: activity
      summary: Activity log
      tags:
        - System
      security:
        - session: []
        - device: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            default: 100
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      exclusiveMinimum: 0
                      maximum: 9007199254740991
                    createdAt:
                      type: string
                      description: ISO 8601 date and time
                    userId:
                      anyOf:
                        - type: integer
                          exclusiveMinimum: 0
                          maximum: 9007199254740991
                        - type: "null"
                    userName:
                      type:
                        - string
                        - "null"
                    action:
                      type: string
                    target:
                      type:
                        - string
                        - "null"
                    details:
                      type:
                        - string
                        - "null"
                  required:
                    - id
                    - createdAt
                    - userId
                    - userName
                    - action
                    - target
                    - details
                  additionalProperties: false
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/auth/login:
    post:
      operationId: login
      summary: Sign in with name, password and TOTP code. Also opens a locked database and a locked session; a session of the same user needs no code
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                password:
                  type: string
                  minLength: 1
                code:
                  type: string
                  pattern: ^\d{6}$
                client:
                  default: web
                  type: string
                  enum:
                    - web
                    - macos
                deviceName:
                  type: string
                  maxLength: 80
              required:
                - name
                - password
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status:
                        type: string
                        const: ok
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            exclusiveMinimum: 0
                            maximum: 9007199254740991
                          name:
                            type: string
                          deviceId:
                            type: integer
                            exclusiveMinimum: 0
                            maximum: 9007199254740991
                          sessionLocked:
                            type: boolean
                          sessionIdleMinutes:
                            type: integer
                            minimum: 0
                            maximum: 9007199254740991
                        required:
                          - id
                          - name
                          - deviceId
                          - sessionLocked
                          - sessionIdleMinutes
                        additionalProperties: false
                      token:
                        type: string
                    required:
                      - status
                      - user
                    additionalProperties: false
                  - type: object
                    properties:
                      status:
                        type: string
                        const: code_required
                    required:
                      - status
                    additionalProperties: false
                  - type: object
                    properties:
                      setupToken:
                        type: string
                      secret:
                        type: string
                      uri:
                        type: string
                      status:
                        type: string
                        const: totp_setup
                    required:
                      - setupToken
                      - secret
                      - uri
                      - status
                    additionalProperties: false
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/auth/totp:
    post:
      operationId: confirmTotp
      summary: Confirm a new TOTP secret and sign in
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                setupToken:
                  type: string
                  minLength: 1
                code:
                  type: string
                  pattern: ^\d{6}$
                client:
                  default: web
                  type: string
                  enum:
                    - web
                    - macos
                deviceName:
                  type: string
                  maxLength: 80
              required:
                - setupToken
                - code
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status:
                        type: string
                        const: ok
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            exclusiveMinimum: 0
                            maximum: 9007199254740991
                          name:
                            type: string
                          deviceId:
                            type: integer
                            exclusiveMinimum: 0
                            maximum: 9007199254740991
                          sessionLocked:
                            type: boolean
                          sessionIdleMinutes:
                            type: integer
                            minimum: 0
                            maximum: 9007199254740991
                        required:
                          - id
                          - name
                          - deviceId
                          - sessionLocked
                          - sessionIdleMinutes
                        additionalProperties: false
                      token:
                        type: string
                    required:
                      - status
                      - user
                    additionalProperties: false
                  - type: object
                    properties:
                      status:
                        type: string
                        const: code_required
                    required:
                      - status
                    additionalProperties: false
                  - type: object
                    properties:
                      setupToken:
                        type: string
                      secret:
                        type: string
                      uri:
                        type: string
                      status:
                        type: string
                        const: totp_setup
                    required:
                      - setupToken
                      - secret
                      - uri
                      - status
                    additionalProperties: false
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
