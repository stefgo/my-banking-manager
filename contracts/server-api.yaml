            - field
            - text
          additionalProperties: false
        - type: object
          properties:
            op:
              type: string
              const: replace
            field:
              type: string
              enum:
                - counterparty
                - remittance
            text:
              type: string
              minLength: 1
              maxLength: 200
            with:
              type: string
              maxLength: 400
              description: Text with placeholders
          required:
