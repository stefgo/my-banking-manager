  /api/transactions:
    get:
      operationId: listTransactions
      summary: Bookings matching the filters, newest first
      tags:
        - Transactions
      security:
        - session: []
        - device: []
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            default: all
            type: string
            pattern: ^(all|group:\d+|account:\d+)$
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum:
              - "30"
              - "90"
              - "365"
              - month
              - last
              - all
        - name: from
          in: query
          required: false
          schema:
            type: string
        - name: to
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            description: 'Search: words (space = AND), "phrases", wildcards * and ?, UND/ODER/NICHT (or AND/OR/NOT, -word), parentheses, fields gegenseite: zweck: iban: konto: kategorie: betrag: datum: (or counterparty: purpose: account: category: amount: date:), comparisons > >= < <= = for amounts and dates, ist:neu (or is:new) for new bookings'
            type: string
            maxLength: 200
        - name: category
          in: query
          required: false
          schema:
            default: all
            description: all, or a comma-separated list of category ids and none
            type: string
            pattern: ^(all|(none|\d+)(,(none|\d+)){0,99})$
        - name: dir
          in: query
          required: false
          schema:
            default: all
            type: string
            enum:
              - all
              - in
              - out
        - name: pending
          in: query
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: limit
          in: query
          required: false
          schema:
            default: 5000
            type: integer
            minimum: 1
            maximum: 20000
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          exclusiveMinimum: 0
                          maximum: 9007199254740991
                        accountId:
                          type: integer
                          exclusiveMinimum: 0
                          maximum: 9007199254740991
