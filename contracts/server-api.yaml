                maxLength: 40
              description: Words in the status that mark a pending booking; empty for the usual ones
            referenceMatch:
              description: "Per reference field of the file: the kinds of reference of a booking already stored that are searched for its value before it is filled in. Its own kind always counts; without an entry, all kinds"
