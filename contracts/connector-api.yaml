          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorError"
  /v1/psd2/transactions:
    post:
      operationId: psd2Transactions
      summary: "PSD2: booked and pending transactions of an account; without a start date as far back as the bank allows"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bank:
                  type: object
                  properties:
                    aspsp:
                      type: string
                      minLength: 1
                      maxLength: 100
                    country:
                      type: string
                      pattern: ^[A-Z]{2}$
                  required:
                    - aspsp
                    - country
                login:
                  type: object
                  properties:
                    applicationId:
                      type: string
                      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    privateKey:
                      type: string
                      minLength: 100
                      maxLength: 20000
                    state:
                      type: string
                      maxLength: 200000
                  required:
                    - applicationId
                    - privateKey
                psu:
                  type: object
                  properties:
                    ipAddress:
                      type: string
                      maxLength: 45
                    userAgent:
                      type: string
                      maxLength: 500
                  required:
                    - ipAddress
                    - userAgent
                account:
                  type: object
                  properties:
                    accountNumber:
                      type: string
                      minLength: 1
                      maxLength: 35
                    subAccount:
                      default: ""
                      type: string
                      maxLength: 30
                    iban:
                      default: null
                      anyOf:
                        - type: string
                          maxLength: 34
                        - type: "null"
                    bic:
                      default: null
                      anyOf:
                        - type: string
                          maxLength: 11
                        - type: "null"
                  required:
                    - accountNumber
                from:
                  type: string
              required:
                - bank
                - login
                - account
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status:
                        type: string
                        const: done
                      data:
                        type: object
                        properties:
                          transactions:
                            type: array
                            items:
                              type: object
                              properties:
                                bookingDate:
                                  type: string
                                valueDate:
                                  type:
                                    - string
                                    - "null"
                                amount:
                                  type: integer
                                  minimum: -9007199254740991
                                  maximum: 9007199254740991
                                currency:
                                  type: string
                                status:
                                  type: string
                                  enum:
                                    - booked
                                    - pending
                                counterpartyName:
                                  type: string
                                ultimateParty:
                                  default: ""
                                  type: string
                                counterpartyIban:
                                  type:
                                    - string
                                    - "null"
                                counterpartyBic:
                                  type:
                                    - string
                                    - "null"
                                counterpartyAccount:
                                  default: ""
                                  type: string
                                counterpartyBankCode:
                                  default: ""
                                  type: string
                                remittance:
                                  type: string
                                endToEndId:
                                  type:
                                    - string
                                    - "null"
                                customerReference:
                                  default: null
                                  type:
                                    - string
                                    - "null"
                                mandateId:
                                  type:
                                    - string
                                    - "null"
                                creditorId:
                                  type:
                                    - string
                                    - "null"
                                bookingText:
                                  type: string
                                bankReference:
                                  type:
                                    - string
                                    - "null"
                                isReturn:
                                  default: false
                                  type: boolean
                                returnReason:
                                  default: ""
                                  type: string
                                replaces:
                                  default: null
                                  anyOf:
                                    - type: object
                                      properties:
                                        counterpartyIban:
                                          type:
                                            - string
                                            - "null"
                                        remittance:
                                          type: string
                                        endToEndId:
                                          type:
                                            - string
                                            - "null"
                                      required:
                                        - counterpartyIban
                                        - remittance
                                        - endToEndId
                                      additionalProperties: false
                                    - type: "null"
                                transfer:
                                  default: null
                                  anyOf:
                                    - type: string
                                      enum:
                                        - repayment
                                        - credit
                                        - payout
                                        - refund
                                    - type: "null"
                              required:
                                - bookingDate
                                - valueDate
                                - amount
                                - currency
                                - status
                                - counterpartyName
                                - ultimateParty
                                - counterpartyIban
                                - counterpartyBic
                                - counterpartyAccount
                                - counterpartyBankCode
                                - remittance
                                - endToEndId
                                - customerReference
                                - mandateId
                                - creditorId
                                - bookingText
                                - bankReference
                                - isReturn
                                - returnReason
                                - replaces
                                - transfer
                              additionalProperties: false
                          foreignCurrency:
                            default: 0
                            type: integer
                            minimum: 0
                            maximum: 9007199254740991
                        required:
                          - transactions
                          - foreignCurrency
                        additionalProperties: false
                      state:
                        type: string
                    required:
                      - status
                      - data
                      - state
                    additionalProperties: false
                  - type: object
                    properties:
                      status:
                        type: string
                        const: approval
                      operationId:
                        type: string
                      challenge:
                        type: object
                        properties:
