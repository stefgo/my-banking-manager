                            type: boolean
                          text:
                            type: string
                          medium:
                            type: string
                          validUntil:
                            type: string
                          methodName:
                            type: string
                        required:
                          - decoupled
                          - text
                          - medium
                          - validUntil
                          - methodName
                        additionalProperties: false
                      vop:
                        type: object
                        properties:
                          result:
                            type: string
                            enum:
                              - match
                              - close_match
                              - no_match
                              - not_applicable
                              - pending
                              - none
                          payeeName:
                            type:
                              - string
                              - "null"
                          reason:
                            type:
                              - string
                              - "null"
                          explanation:
                            type: string
                          structured:
                            type: boolean
                        required:
                          - result
                          - payeeName
                          - reason
                          - explanation
                          - structured
                        additionalProperties: false
                    required:
                      - status
                      - operationId
                      - challenge
                    additionalProperties: false
        default:
