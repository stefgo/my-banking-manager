<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 385" width="1210" height="385" role="img" aria-labelledby="title">
<title id="title">Schlüsselkette: Passwort oder Wiederherstellungsschlüssel packen den Datenschlüssel aus keystore.json aus. Er öffnet mbm.db und liefert den Feldschlüssel für das TOTP-Geheimnis. Bankzugangsdaten versiegelt zusätzlich der Benutzerschlüssel, den nur Passwort oder Sitzungstoken des Besitzers öffnen.</title>
<style>
svg { --bg: #FFFFFF; --frame: #E2E2EA; --box: #F6F6FA; --box-line: #E2E2EA; --fg: #14151A; --muted: #646878; --faint: #9A9DAB;
    --iris: #2F55D4; --iris-soft: #E9EDFA; --pos: #0F9D63; --warn: #B7791F; --neg: #D63A4A;
    --d-user: #5B47F0; --d-bank: #0B85AE; --d-acc: #2F6FD6; --d-tx: #0F9D63; --d-cat: #B7791F; --d-ord: #C2417B; --d-misc: #7A7F90; }
@media (prefers-color-scheme: dark) {
    svg { --bg: #12141C; --frame: #262A37; --box: #181B26; --box-line: #2C3040; --fg: #ECEDF2; --muted: #8B90A3; --faint: #5D6276;
        --iris: #4F7BFF; --iris-soft: #1C2440; --pos: #3DDC97; --warn: #F5B54A; --neg: #FF6B7A;
        --d-user: #A497FF; --d-bank: #67D4F5; --d-acc: #7CB7FF; --d-tx: #3DDC97; --d-cat: #F5B54A; --d-ord: #F38BB8; --d-misc: #A0A5B8; }
}
.bg { fill: var(--bg); stroke: var(--frame); }
text { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
.box { fill: var(--box); stroke: var(--box-line); }
.d-user { --d: var(--d-user); } .d-bank { --d: var(--d-bank); } .d-acc { --d: var(--d-acc); } .d-tx { --d: var(--d-tx); }
.d-cat { --d: var(--d-cat); } .d-ord { --d: var(--d-ord); } .d-misc { --d: var(--d-misc); }
.stripe { fill: var(--d); }
.name { fill: var(--fg); font-size: 12.5px; font-weight: 600; }
.sub { fill: var(--muted); font-size: 10.5px; }
.edge { fill: none; stroke: var(--muted); stroke-width: 1.3; }
.edge.setnull { stroke-dasharray: 5 4; }
.edge.logical { stroke-dasharray: 1.5 3.5; stroke-width: 1.6; }
.edge.restrict { stroke: var(--warn); stroke-width: 1.6; }
.edge.accent { stroke: var(--iris); }
.head { fill: var(--muted); } .head.restrict { fill: var(--warn); } .head.accent { fill: var(--iris); }
.label { fill: var(--muted); font-size: 10.5px; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.divider { stroke: var(--frame); stroke-dasharray: 2 4; }
.group { fill: none; stroke: var(--faint); stroke-dasharray: 5 4; }
.glabel { fill: var(--muted); font-size: 11px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.k-secret { fill: var(--box); stroke: var(--muted); stroke-dasharray: 4 3; }
.k-file { fill: var(--box); stroke: var(--box-line); }
.k-key { fill: var(--iris-soft); stroke: var(--iris); }
.k-field { fill: var(--box); stroke: var(--box-line); }
.k-plain { fill: none; stroke: var(--faint); stroke-dasharray: 2 3; }
.s-run { fill: var(--iris-soft); stroke: var(--iris); }
.s-wait { fill: var(--box); stroke: var(--box-line); }
.s-ok { fill: var(--box); stroke: var(--pos); stroke-width: 1.6; }
.s-bad { fill: var(--box); stroke: var(--neg); stroke-width: 1.6; }
.s-warn { fill: var(--box); stroke: var(--warn); stroke-width: 1.6; }
.s-end { fill: var(--box); stroke: var(--muted); }
</style>
<defs><marker id="head-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="head plain"/></marker><marker id="head-restrict" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="head restrict"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="head accent"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="1209" height="384" rx="14"/>
<path class="edge flow" d="M225.6,75.5 L255,82.2" marker-end="url(#head-plain)"/>
<path class="edge flow" d="M225.6,136.5 L255,129.8" marker-end="url(#head-plain)"/>
<path class="edge flow" d="M465,106 L510,106" marker-end="url(#head-plain)"/>
<path class="edge flow" d="M710,84.4 L755,74.7" marker-end="url(#head-plain)"/>
<path class="edge flow" d="M710,127.6 L755,137.3" marker-end="url(#head-plain)"/>
<path class="edge flow" d="M965,160 L1008,160" marker-end="url(#head-plain)"/>
<path class="edge flow" d="M184.1,183.5 L315,233" marker-end="url(#head-plain)"/>
<path class="edge flow" d="M235,340 L255,340" marker-end="url(#head-plain)"/>
<path class="edge flow" d="M454.4,267 L510,277" marker-end="url(#head-plain)"/>
<path class="edge flow" d="M454.4,323 L510,313" marker-end="url(#head-plain)"/>
<path class="edge flow accent" d="M710,295 L755,295" marker-end="url(#head-accent)"/>
<g class="k-secret">
<rect class="k-secret" x="9" y="28.5" width="226" height="47" rx="7"/>
<text class="name" x="122" y="49" text-anchor="middle">Wiederherstellungsschlüssel</text>
<text class="sub" x="122" y="63" text-anchor="middle">beim Betreiber, auf Papier</text>
</g>
<g class="k-secret">
<rect class="k-secret" x="9" y="136.5" width="226" height="47" rx="7"/>
<text class="name" x="122" y="157" text-anchor="middle">Passwort</text>
<text class="sub" x="122" y="171" text-anchor="middle">je Benutzer, im Kopf</text>
</g>
<g class="k-secret">
<rect class="k-secret" x="9" y="316.5" width="226" height="47" rx="7"/>
<text class="name" x="122" y="337" text-anchor="middle">Sitzungstoken</text>
<text class="sub" x="122" y="351" text-anchor="middle">beim Client (Cookie / Gerät)</text>
</g>
<g class="k-file">
<rect class="k-file" x="255" y="76" width="210" height="60" rx="7"/>
<text class="name" x="360" y="96.5" text-anchor="middle">keystore.json</text>
<text class="sub" x="360" y="110.5" text-anchor="middle">Datenschlüssel, verpackt:</text>
<text class="sub" x="360" y="123.5" text-anchor="middle">je Benutzer + Wiederherstellung</text>
</g>
<g class="k-field">
<rect class="k-field" x="255" y="233" width="210" height="34" rx="7"/>
<text class="name" x="360" y="253.5" text-anchor="middle">users.sealed_user_key</text>
</g>
<g class="k-field">
<rect class="k-field" x="255" y="323" width="210" height="34" rx="7"/>
<text class="name" x="360" y="343.5" text-anchor="middle">devices.sealed_user_key</text>
</g>
<g class="k-key">
<rect class="k-key" x="510" y="82.5" width="200" height="47" rx="7"/>
<text class="name" x="610" y="103" text-anchor="middle">Datenschlüssel</text>
<text class="sub" x="610" y="117" text-anchor="middle">nur im RAM, solange entsperrt</text>
</g>
<g class="k-key">
<rect class="k-key" x="510" y="271.5" width="200" height="47" rx="7"/>
<text class="name" x="610" y="292" text-anchor="middle">Benutzerschlüssel</text>
<text class="sub" x="610" y="306" text-anchor="middle">je Benutzer, nur pro Anfrage</text>
</g>
<g class="k-file">
<rect class="k-file" x="755" y="28.5" width="210" height="47" rx="7"/>
<text class="name" x="860" y="49" text-anchor="middle">mbm.db + WAL</text>
<text class="sub" x="860" y="63" text-anchor="middle">SQLCipher: AES-256 + HMAC</text>
</g>
<g class="k-key">
<rect class="k-key" x="755" y="136.5" width="210" height="47" rx="7"/>
<text class="name" x="860" y="157" text-anchor="middle">Feldschlüssel</text>
<text class="sub" x="860" y="171" text-anchor="middle">HKDF »mbm-fields-v1«</text>
</g>
<g class="k-field">
<rect class="k-field" x="1008" y="143" width="200" height="34" rx="7"/>
<text class="name" x="1108" y="163.5" text-anchor="middle">users.totp_secret</text>
</g>
<g class="k-field">
<rect class="k-field" x="755" y="265" width="210" height="60" rx="7"/>
<text class="name" x="860" y="285.5" text-anchor="middle">bank_logins</text>
<text class="sub" x="860" y="299.5" text-anchor="middle">sealed_credentials,</text>
<text class="sub" x="860" y="312.5" text-anchor="middle">sealed_connector_state</text>
</g>
<g class="k-plain">
<rect class="k-plain" x="1000" y="28.5" width="200" height="47" rx="7"/>
<text class="name" x="1100" y="49" text-anchor="middle">blz.json</text>
<text class="sub" x="1100" y="63" text-anchor="middle">unverschlüsselt, öffentlich</text>
</g>
<text class="label" x="240.3" y="72.8" text-anchor="middle"><tspan x="240.3" dy="0">scrypt</tspan></text>
<text class="label" x="240.3" y="149.2" text-anchor="middle"><tspan x="240.3" dy="0">scrypt</tspan></text>
<text class="label" x="487.5" y="100" text-anchor="middle"><tspan x="487.5" dy="0">packt aus</tspan></text>
<text class="label" x="716.5" y="77.5" text-anchor="middle"><tspan x="716.5" dy="0">öffnet</tspan></text>
<text class="label" x="718.5" y="144.5" text-anchor="middle"><tspan x="718.5" dy="0">HKDF</tspan></text>
<text class="label" x="986.5" y="154" text-anchor="middle"><tspan x="986.5" dy="0">AES-GCM</tspan></text>
<text class="label" x="243.6" y="226.3" text-anchor="middle"><tspan x="243.6" dy="0">scrypt</tspan></text>
<text class="label" x="245" y="334" text-anchor="middle"><tspan x="245" dy="0">HKDF</tspan></text>
<text class="label" x="486.2" y="264" text-anchor="middle"><tspan x="486.2" dy="0">AES-GCM</tspan></text>
<text class="label" x="486.2" y="336" text-anchor="middle"><tspan x="486.2" dy="0">AES-GCM</tspan></text>
<text class="label" x="732.5" y="289" text-anchor="middle"><tspan x="732.5" dy="0">AES-GCM</tspan></text>
</svg>
